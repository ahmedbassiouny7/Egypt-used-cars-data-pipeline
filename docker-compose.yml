x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-egypt-used-cars-airflow:local}
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    CARS_DB_HOST: cars-postgres
    CARS_DB_PORT: 5432
    CARS_DB_NAME: cars_dw
    CARS_DB_USER: cars_user
    CARS_DB_PASSWORD: cars_password
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    cars-postgres:
      condition: service_healthy
    selenium:
      condition: service_healthy

services:
  # Remote Chrome browser used by Selenium scraping scripts.
  selenium:
    image: selenium/standalone-chrome:4.21.0
    shm_size: 2gb
    ports:
      - "7900:7900"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4444/status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: always

  # Airflow metadata database. This is separate from the analytical warehouse.
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Project warehouse database exposed locally on port 5433 for Power BI/DB tools.
  cars-postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: cars_user
      POSTGRES_PASSWORD: cars_password
      POSTGRES_DB: cars_dw
    ports:
      - "5433:5432"
    volumes:
      - cars-db-volume:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cars_user", "-d", "cars_dw"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # One-time Airflow setup. The webserver/scheduler wait for this to complete.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  # Airflow UI: http://localhost:8080
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Executes DAG tasks with LocalExecutor.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  cars-db-volume:
